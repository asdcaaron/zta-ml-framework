# =============================================================================
# OpenVPN Server Configuration — Legacy VPN Baseline
# =============================================================================
# This file represents the TRADITIONAL perimeter-based VPN used as the
# baseline (System A) in the comparative evaluation.
#
# Key characteristics of this legacy setup:
#   - No continuous authentication after initial connect
#   - No least-privilege / micro-segmentation (flat internal network)
#   - No ML-based anomaly detection
#   - No device posture checking
#   - Once connected, user has broad internal network access
#
# This is intentionally left as a standard OpenVPN config to illustrate
# the security gaps that ZTA + ML addresses.
#
# Lab Setup:
#   1. Install OpenVPN on the gateway VM in GNS3
#   2. Generate PKI with easy-rsa (see vpn/openvpn_config/setup.sh)
#   3. Copy client config (client.conf) to each simulated client VM
#   4. Start server: sudo openvpn --config server.conf
# =============================================================================

# ── Network settings ──────────────────────────────────────────────────────────
port    1194
proto   udp
dev     tun

# ── PKI / Certificates ────────────────────────────────────────────────────────
ca      /etc/openvpn/pki/ca.crt
cert    /etc/openvpn/pki/server.crt
key     /etc/openvpn/pki/server.key
dh      /etc/openvpn/pki/dh.pem

# TLS authentication key (pre-shared, HMAC-based)
tls-auth /etc/openvpn/pki/ta.key 0

# ── IP pool for connected clients ─────────────────────────────────────────────
server  10.8.0.0 255.255.255.0

# Push full routing to clients (entire internal network reachable)
# NOTE: This is the flat-network weakness — all segments accessible once connected
push "route 192.168.10.0 255.255.255.0"   # internal_apps VLAN
push "route 192.168.20.0 255.255.255.0"   # database VLAN
push "route 192.168.30.0 255.255.255.0"   # management VLAN
push "redirect-gateway def1 bypass-dhcp"

# DNS
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"

# ── Session / keepalive ───────────────────────────────────────────────────────
keepalive  10 120
# No re-authentication — session persists until timeout or explicit disconnect
# This is a critical gap vs ZTA continuous auth
inactive   3600          ; disconnect after 1h idle
ping-restart 60

# ── Cryptography ─────────────────────────────────────────────────────────────
cipher    AES-256-CBC
auth      SHA256
tls-version-min 1.2

# ── Compression ──────────────────────────────────────────────────────────────
compress lz4-v2
push "compress lz4-v2"

# ── Privilege dropping ────────────────────────────────────────────────────────
user   nobody
group  nogroup
persist-key
persist-tun

# ── Logging ───────────────────────────────────────────────────────────────────
status      /var/log/openvpn/status.log   10
log-append  /var/log/openvpn/server.log
verb        3
mute        20

# ── Client config dir (per-client IP assignments) ────────────────────────────
client-config-dir /etc/openvpn/ccd
ifconfig-pool-persist /etc/openvpn/ipp.txt

# Max clients
max-clients 50

# ── Security gaps present in this baseline (for research comparison) ──────────
# 1. No continuous re-authentication (authenticate once, trust forever)
# 2. No device health / posture checks
# 3. No ML anomaly detection on tunnel traffic
# 4. Flat routing: all internal subnets reachable after connection
# 5. No micro-segmentation: lateral movement possible once inside
# 6. No risk scoring: cannot detect insider threats or compromised credentials
# 7. Encrypted tunnel prevents deep packet inspection by default
# =============================================================================
